# The Dev Daily — nginx config for the built static site (dist/).
#
# Pages are written as directory indexes (issue/2026-11-06/index.html), so
# $uri/ resolves the extensionless URLs the templates link to, and a request
# for something that was never built gets the styled 404 page.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
