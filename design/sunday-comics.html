#sunday-paper *{box-sizing:border-box}
#sunday-paper :is(p,small,strong,time,span,summary,button){color:inherit}
#sunday-paper [hidden]{display:none!important}
#sunday-paper.phone{max-width:390px}
#sunday-paper button,#sunday-paper summary{font:inherit;color:inherit;min-height:44px}
#sunday-paper button{background:none;border:0;text-align:left;padding:4px 8px}
#sunday-paper button:hover{background:#e9d9ed}
#sunday-paper .toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:var(--ink);font-size:12px;font-weight:700}
#sunday-paper .tools{display:flex;gap:4px}
#sunday-paper .mast{display:grid;grid-template-columns:minmax(42px,16%) minmax(0,1fr) minmax(54px,15%);align-items:center;gap:8px;text-align:center;padding:3px 0 11px}
#sunday-paper .controller{width:100%;mix-blend-mode:multiply;max-width:130px}
#sunday-paper h1,#sunday-paper h2,#sunday-paper h3{font-family:var(--display);color:var(--ink);line-height:1.01;margin:0;letter-spacing:-.045em}
#sunday-paper h1{font-size:clamp(33px,9.4cqi,96px);white-space:nowrap;font-weight:900}
#sunday-paper .underline{margin:2px 9% 9px;height:5px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);rotate:-.6deg}
#sunday-paper .topics,#sunday-paper .edition-line{font-size:11px;letter-spacing:.085em;text-transform:uppercase;font-weight:750}
#sunday-paper .stamp{background:#dfcbe8;clip-path:polygon(0 7%,97% 0,100% 93%,5% 100%);rotate:-8deg;padding:8px 4px;font-size:clamp(10px,1.45cqi,15px);font-weight:850;line-height:1.15;text-transform:uppercase}
#sunday-paper .edition-line{display:flex;gap:7px 14px;justify-content:space-between;align-items:center;border-block:1px solid var(--ink);padding:8px 0}
#sunday-paper .spread{display:grid;grid-template-columns:minmax(132px,21%) minmax(0,1fr);gap:17px;margin-top:17px}
#sunday-paper aside{border-right:1px solid var(--ink);padding-right:12px;display:flex;flex-direction:column}
#sunday-paper .brush{display:inline-block;width:fit-content;color:#fff7f6;background:linear-gradient(102deg,#60247b,#793789 57%,#4f1c70);font-weight:850;text-transform:uppercase;letter-spacing:.035em;padding:5px 12px;rotate:-2deg;clip-path:polygon(2% 8%,96% 0,100% 12%,97% 20%,100% 31%,98% 62%,100% 72%,96% 80%,99% 90%,1% 100%,3% 85%,0 77%,2% 61%,0 44%,3% 26%,0 17%)}
#sunday-paper .contents{display:grid;margin-top:9px}
#sunday-paper .contents button{display:flex;align-items:center;gap:8px;font-weight:670;border-radius:5px}
#sunday-paper .contents .selected{background:var(--lavender)}
#sunday-paper .ico{display:inline-flex;width:20px;justify-content:center;font-size:18px}
#sunday-paper .quick{border-top:1px solid var(--ink);padding-top:13px;margin-top:12px}
#sunday-paper .coffee{margin:auto auto 0;width:100%;max-width:184px;display:block;mix-blend-mode:multiply}
#sunday-paper .heading-rule{display:flex;align-items:center;gap:8px}
#sunday-paper .heading-rule::after{content:'';flex:1;height:3px;border-top:1px solid var(--ink);border-radius:50%;transform:rotate(.35deg)}
#sunday-paper .lead{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);align-items:center;gap:17px;margin:0 0 14px}
#sunday-paper .lead figure{margin:0;padding:6px;background:#fffaf2;rotate:-3deg;box-shadow:1px 3px 5px #4c306747;clip-path:polygon(1% 2%,98% 0,100% 12%,98% 36%,100% 70%,98% 98%,5% 100%,1% 96%,0 10%)}
#sunday-paper img{display:block;max-width:100%}
#sunday-paper .lead img{width:100%;aspect-ratio:1.06;object-fit:cover}
#sunday-paper .lead h2{font-size:clamp(26px,4.2cqi,49px)}
#sunday-paper p{margin:8px 0}
#sunday-paper .tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
#sunday-paper .tag{border:1px solid #825398;background:#805696;color:white;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:680;text-transform:uppercase}
#sunday-paper .tag:last-child{background:transparent;color:var(--ink)}
#sunday-paper .read{color:var(--ink);font:italic 800 16px var(--display);text-decoration:underline;text-underline-offset:3px;margin-left:auto}
#sunday-paper .side-stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#sunday-paper .story{padding:8px;border:1px solid #cabbac;border-radius:9px;background:#fff7ed55;box-shadow:0 2px 2px #4d333211}
#sunday-paper .story img,#sunday-paper .article-image{width:100%;aspect-ratio:2.5;object-fit:cover;border-radius:6px;margin-bottom:7px}
#sunday-paper .story h2{font-size:clamp(22px,3cqi,32px)}
#sunday-paper .roundup{margin-top:15px}
#sunday-paper .roundup button{width:100%;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:53px 1fr auto;align-items:center;gap:8px;padding:7px 4px}
#sunday-paper .roundup img{width:53px;aspect-ratio:1.6;object-fit:cover;border-radius:4px}
#sunday-paper .roundup strong{font:800 15px var(--display);display:block}
#sunday-paper .roundup small{font-size:12px}
#sunday-paper .mobile-toc{display:none}
#sunday-paper .panel{max-width:660px;margin:15px auto}
#sunday-paper .panel h2{font-size:clamp(26px,5.8cqi,46px);margin-bottom:10px}
#sunday-paper .archive-title{background:#483052;color:#fff5e9!important;border-radius:8px 8px 0 0;padding:12px 16px}
#sunday-paper .issue-row{display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:9px;border:1px solid var(--rule);border-radius:8px;margin:6px 0;width:100%;padding:8px 12px;background:#fff7ed88}
#sunday-paper .issue-row[aria-current=true]{background:var(--lavender)}
#sunday-paper .issue-row strong{display:block;font-family:var(--display);font-size:16px}
#sunday-paper .article-section{color:var(--ink);font:800 22px var(--display);border-bottom:2px solid var(--rule);margin-bottom:12px;padding-bottom:6px}
#sunday-paper .mobile-toc summary{align-content:center;font:800 15px var(--display)}
#sunday-paper .article-copy{margin-top:21px;border-top:1px solid var(--rule);padding-top:15px}
#sunday-paper .article-copy section+section{margin-top:21px}
#sunday-paper .article-copy h3{font-size:clamp(19px,2.8cqi,24px)}
#sunday-paper .article-copy p{font:17px/1.6 Georgia,serif;margin:6px 0 0}
@container (max-width:620px){
 #sunday-paper .spread{display:block}
 #sunday-paper aside{display:none}
 #sunday-paper .mobile-toc{display:block;background:var(--lavender);border:1px solid #a98cbd;border-radius:6px;padding:0 10px;margin-bottom:14px}
 #sunday-paper .mobile-toc .contents{margin:0 0 6px}
}
@container (max-width:460px){
 #sunday-paper .mast{grid-template-columns:42px 1fr;text-align:left}
 #sunday-paper h1{font-size:clamp(29px,10cqi,44px)}
 #sunday-paper .stamp,#sunday-paper .topics,#sunday-paper .local{display:none}
 #sunday-paper .lead,#sunday-paper .side-stories{grid-template-columns:minmax(0,1fr)}
 #sunday-paper .lead figure{rotate:-1deg;margin:2px 3px 0}
 #sunday-paper .lead img{aspect-ratio:1.8;object-position:center 35%}
 #sunday-paper .lead{gap:10px}
 #sunday-paper .toolbar{font-size:11px}
}
</style>

 date.dateTime = '2026-11-0'+(6-edition);
 if (view === 'archive') {
  body.innerHTML = '<section class="panel">'+back+'<h2 class="archive-title">▤ All Editions</h2>'+dates.map((d,i)=>'<button type="button" class="issue-row" data-go="edition-'+i+'" aria-current="'+(i===edition)+'"><span aria-hidden="true">▤</span><span><strong>'+d+'</strong>Edition #'+issue(i)+(i?' · Sample':'')+'</span><span aria-hidden="true">›</span></button>').join('')+'</section>';
 } else if (typeof view === 'number') {
  const s = stories[view];
  body.innerHTML = '<article class="panel">'+back+'<div class="article-section">'+s.icon+' '+s.topic+'</div><img class="article-image" src="'+s.image+'" alt="'+s.alt+'"><h2>'+s.title+'</h2><p><strong>'+s.date+'</strong></p><p>'+s.summary+'</p><div class="tagrow">'+tags(s)+'</div>'+'<div class="article-copy">'+[['What changed',s.change],['Why it matters',s.why],['Try or teach',s.try],['Limitations',s.limit]].map(([label,value])=>'<section><h3>'+label+'</h3><p>'+value+'</p></section>').join('')+'</div></article>';
 } else {
  body.innerHTML = edition ? '<section class="panel"><h2>Sample back issue</h2><p>The November 6 edition has the stories from your briefing.</p><button type="button" data-go="edition-0">Read the latest edition →</button></section>' : front;
 }
}
paper.addEventListener('click',event=>{
 const button = event.target.closest('[data-go]');
 if(!button) return;
 const action = button.dataset.go;
 if(action==='phone'){
  const narrow=paper.classList.toggle('phone');
  button.textContent=narrow?'Desktop view':'Phone view';
  button.setAttribute('aria-pressed',narrow);
  return;
 }
 if(action==='top'||action==='roundup'){
  const toc=body.querySelector('.mobile-toc');
  if(toc) toc.open=false;
  body.querySelector('#sunday-'+action)?.scrollIntoView({block:'start'});
  return;
 }
 if(action.startsWith('story-')) view=Number(action.slice(6));
 else if(action.startsWith('edition-')){edition=Number(action.slice(8));view='home';}
 else view=action;
 render();
 if(view==='home') paper.querySelector('.edition-line').scrollIntoView({block:'nearest'});
 else body.scrollIntoView({block:'nearest'});
});
render();
})();
</script>

</body></html>
